services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gistai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gistai
      POSTGRES_USER: gistai
      POSTGRES_PASSWORD: gistai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gistai -d gistai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
